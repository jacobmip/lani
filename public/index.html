<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lani</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 48px;
    }

    #orb {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #1a6fff, #0033cc);
      box-shadow: 0 0 40px rgba(26, 111, 255, 0.4);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #orb:active { transform: scale(0.96); }

    #orb.listening {
      animation: pulse 1.2s ease-in-out infinite;
      box-shadow: 0 0 60px rgba(26, 111, 255, 0.7);
    }

    #orb.thinking {
      background: radial-gradient(circle at 40% 40%, #ff6a1a, #cc4400);
      box-shadow: 0 0 40px rgba(255, 106, 26, 0.5);
    }

    #orb.speaking {
      animation: pulse-speak 0.8s ease-in-out infinite;
      box-shadow: 0 0 60px rgba(26, 111, 255, 0.9);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes pulse-speak {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    #mic-icon {
      width: 48px;
      height: 48px;
      fill: rgba(255,255,255,0.9);
    }

    #status {
      margin-top: 32px;
      font-size: 0.9rem;
      color: #666;
      letter-spacing: 0.05em;
      min-height: 24px;
      text-align: center;
    }

    #transcript {
      margin-top: 24px;
      max-width: 480px;
      width: 100%;
      font-size: 1rem;
      color: #ccc;
      text-align: center;
      line-height: 1.6;
      min-height: 48px;
    }

    #response {
      margin-top: 16px;
      max-width: 480px;
      width: 100%;
      font-size: 1.05rem;
      color: #fff;
      text-align: center;
      line-height: 1.7;
      min-height: 48px;
    }

    #history {
      margin-top: 40px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .msg.user {
      background: #1a1a2e;
      color: #aaa;
      align-self: flex-end;
      max-width: 85%;
    }

    .msg.assistant {
      background: #0d1f3c;
      color: #ddd;
      align-self: flex-start;
      max-width: 85%;
    }

    #controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctl {
      background: none;
      border: 1px solid #333;
      color: #555;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .ctl:hover { border-color: #555; color: #888; }

    #voice-select {
      background: #111;
      border: 1px solid #333;
      color: #777;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      max-width: 220px;
    }
  </style>
</head>
<body>
  <h1>Lani</h1>

  <div id="orb" onclick="handleOrb()">
    <svg id="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6.5 9a.5.5 0 0 1 .5.5 6 6 0 0 0 12 0 .5.5 0 0 1 1 0 7 7 0 0 1-6.5 6.93V19h2.5a.5.5 0 0 1 0 1h-6a.5.5 0 0 1 0-1H11v-1.57A7 7 0 0 1 4.5 10.5a.5.5 0 0 1 .5-.5z"/>
    </svg>
  </div>

  <div id="status">Tap to start talking</div>
  <div id="transcript"></div>
  <div id="response"></div>

  <div id="history"></div>

  <div id="controls">
    <select id="voice-select" onchange="onVoiceChange()" aria-label="Voice"></select>
    <button class="ctl" onclick="clearHistory()">Clear conversation</button>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const responseEl = document.getElementById('response');
    const historyEl = document.getElementById('history');
    const voiceSelect = document.getElementById('voice-select');

    // 'off'  = conversation not running
    // 'active' = hands-free loop running (listening -> thinking -> speaking -> listening)
    let mode = 'off';
    let phase = 'idle';
    let recognition = null;
    let gotResultThisTurn = false;
    let consecutiveFailures = 0;
    let speechUnlocked = false;
    let voices = [];
    let selectedVoiceURI = localStorage.getItem('lani-voice') || '';
    let conversationHistory = [];

    /* ---------- Voices ----------
       getVoices() is populated asynchronously. Reading it once on load returns
       an empty array in most browsers, which is why voice selection silently
       fell back to the default before. */
    function loadVoices() {
      voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
      if (!voices.length) return;

      voiceSelect.innerHTML = '';
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = v.name.replace(/\s*\(.*\)\s*/, '');
        voiceSelect.appendChild(opt);
      });

      if (!selectedVoiceURI || !voices.some(v => v.voiceURI === selectedVoiceURI)) {
        const preferred = voices.find(v =>
          /Samantha|Ava|Allison|Google US English|Daniel/i.test(v.name)
        );
        selectedVoiceURI = (preferred || voices[0]).voiceURI;
      }
      voiceSelect.value = selectedVoiceURI;
    }

    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function onVoiceChange() {
      selectedVoiceURI = voiceSelect.value;
      localStorage.setItem('lani-voice', selectedVoiceURI);
      const v = voices.find(x => x.voiceURI === selectedVoiceURI);
      const demo = new SpeechSynthesisUtterance('Got it.');
      if (v) demo.voice = v;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(demo);
    }

    /* ---------- iOS / Safari unlock ----------
       Safari refuses speechSynthesis.speak() unless the first call happens
       inside a real user gesture. Lani's replies arrive after a network round
       trip, long past the tap, so the very first spoken reply was being
       dropped. Priming a silent utterance during the tap lifts that block for
       the rest of the page's life. */
    function unlockSpeech() {
      if (speechUnlocked) return;
      const primer = new SpeechSynthesisUtterance(' ');
      primer.volume = 0;
      window.speechSynthesis.speak(primer);
      speechUnlocked = true;
    }

    if (!SpeechRecognition) {
      statusEl.textContent = 'Voice input not supported. Use Chrome or Safari.';
      orb.style.opacity = '0.4';
      orb.style.cursor = 'default';
    }

    function buildRecognition() {
      const r = new SpeechRecognition();
      r.continuous = false;
      r.interimResults = true;
      r.lang = 'en-US';

      r.onresult = (e) => {
        let finalText = '';
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const chunk = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += chunk;
          else interim += chunk;
        }

        if (interim) transcriptEl.textContent = interim;

        if (finalText.trim()) {
          gotResultThisTurn = true;
          consecutiveFailures = 0;
          transcriptEl.textContent = finalText;
          try { r.stop(); } catch (_) {}
          sendMessage(finalText.trim());
        }
      };

      r.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          endConversation('Microphone blocked. Allow mic access and tap to retry.');
          return;
        }
        // 'no-speech' and 'aborted' are routine — onend handles the restart.
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          consecutiveFailures++;
        }
      };

      r.onend = () => {
        // Fires after every phrase, including silence timeouts. If the loop is
        // still active and no transcript was produced, listen again — this is
        // what makes it hands-free instead of push-to-talk.
        if (mode !== 'active' || phase !== 'listening') return;

        if (gotResultThisTurn) return;

        if (consecutiveFailures >= 5) {
          endConversation('Mic kept failing. Tap to try again.');
          return;
        }
        setTimeout(() => {
          if (mode === 'active' && phase === 'listening') startListening();
        }, 250);
      };

      return r;
    }

    function handleOrb() {
      if (!SpeechRecognition) return;
      if (mode === 'off') startConversation();
      else endConversation('Tap to start talking');
    }

    function startConversation() {
      unlockSpeech();
      mode = 'active';
      consecutiveFailures = 0;
      responseEl.textContent = '';
      startListening();
    }

    function endConversation(message) {
      mode = 'off';
      phase = 'idle';
      try { recognition && recognition.abort(); } catch (_) {}
      window.speechSynthesis.cancel();
      orb.className = '';
      transcriptEl.textContent = '';
      statusEl.textContent = message || 'Tap to start talking';
    }

    function startListening() {
      phase = 'listening';
      gotResultThisTurn = false;
      orb.className = 'listening';
      statusEl.textContent = 'Listening... (tap to stop)';

      recognition = buildRecognition();
      try {
        recognition.start();
      } catch (_) {
        // start() throws if the previous instance hasn't fully released yet.
        setTimeout(() => {
          if (mode === 'active' && phase === 'listening') startListening();
        }, 300);
      }
    }

    async function sendMessage(text) {
      phase = 'thinking';
      orb.className = 'thinking';
      statusEl.textContent = 'Thinking...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: conversationHistory }),
        });

        const data = await res.json();
        const reply = data.reply || 'Sorry, something went wrong.';

        conversationHistory.push({ role: 'user', content: text });
        conversationHistory.push({ role: 'assistant', content: reply });

        if (conversationHistory.length > 20) {
          conversationHistory = conversationHistory.slice(-20);
        }

        responseEl.textContent = reply;
        addToHistory(text, reply);
        speak(reply);
      } catch (_) {
        speak('Sorry, I could not reach the server.');
      }
    }

    function speak(text) {
      phase = 'speaking';
      orb.className = 'speaking';
      statusEl.textContent = 'Speaking... (tap to stop)';

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const v = voices.find(x => x.voiceURI === selectedVoiceURI);
      if (v) utterance.voice = v;

      // The mic must not be open while Lani is talking, or she transcribes
      // herself and answers her own sentences. Listening only resumes here.
      const resume = () => {
        if (mode !== 'active') return;
        startListening();
      };

      utterance.onend = resume;
      utterance.onerror = resume;

      window.speechSynthesis.speak(utterance);

      // Safari sometimes drops onend entirely. Without this the loop would
      // stall in 'speaking' forever, so estimate the duration and recover.
      const fallbackMs = Math.min(30000, 1500 + text.length * 70);
      setTimeout(() => {
        if (mode === 'active' && phase === 'speaking' && !window.speechSynthesis.speaking) {
          resume();
        }
      }, fallbackMs);
    }

    function addToHistory(userText, assistantText) {
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = userText;

      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'msg assistant';
      assistantMsg.textContent = assistantText;

      historyEl.appendChild(userMsg);
      historyEl.appendChild(assistantMsg);
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function clearHistory() {
      conversationHistory = [];
      historyEl.innerHTML = '';
      transcriptEl.textContent = '';
      responseEl.textContent = '';
      if (mode === 'off') statusEl.textContent = 'Tap to start talking';
    }
  </script>
</body>
</html>
